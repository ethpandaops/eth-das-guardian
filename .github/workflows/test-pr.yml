
name: Check PR

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_source:
    name: "Run code checks"
    uses: ./.github/workflows/_shared-check.yaml

  check_workflows:
    name: "Check workflow boundaries"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Install actionlint
      env:
        ACTIONLINT_VERSION: 1.7.12
        ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      run: |
        set -euo pipefail
        archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        curl --fail --location --silent --show-error \
          --output "$RUNNER_TEMP/$archive" \
          "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
        echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
        tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" actionlint
    - name: Lint workflows
      run: exec "$RUNNER_TEMP/actionlint" -shellcheck=
    - name: Check publication workflow boundaries
      run: python3 .github/scripts/check_workflow_boundaries.py
