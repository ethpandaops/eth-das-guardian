name: Build main

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  check_source:
    name: "Run code checks"
    uses: ./.github/workflows/_shared-check.yaml

  build_binaries:
    name: "Build DasGuardian"
    needs: [check_source]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_shared-build.yaml
    with:
      ref: ${{ github.sha }}
      release: "snapshot"
      docker: true
      docker_repository: "ghcr.io/ethpandaops/eth-das-guardian"
      docker_tag_prefix: "main"
      additional_tags: "['main','main-latest']"
    secrets:
      IMAGE_MIRROR_URL: ${{ secrets.IMAGE_MIRROR_URL }}
